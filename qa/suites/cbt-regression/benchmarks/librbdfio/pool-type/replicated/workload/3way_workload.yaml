tasks:
- cephadm.shell:
    mon.a:
      - |
        set -ex
        
        # Create replicated pool for RBD (3-way replication)
        
        ceph osd pool create rbd_replicated 64 64 replicated
        rbd pool init rbd_replicated
        
        for i in $(seq 0 15); do
          rbd create --size 62500 --pool rbd_replicated cbt-librbdfio-${i}
        done

- cbt:
    cluster:
      user: ubuntu
      osds_per_node: 4
      iterations: 1

    benchmarks:
      librbdfio:
        create_report: True
        time: 30
        ramp: 10
        time_based: True
        norandommap: True
        vol_size: 62500
        use_existing_volumes: True
        poolname: 'rbd_replicated'
        rbdname: 'cbt-librbdfio'
        procs_per_volume: [1]
        volumes_per_client: [16]
        osd_ra: [4096]
        log_iops: True
        log_bw: True
        log_lat: True
        fio_out_format: 'json'
        log_avg_msec: 100
        prefill:
          blocksize: '64k'
          numjobs: 1

        workloads:
          4krandomwrite:
            jobname: 'randwrite'
            mode: 'randwrite'
            op_size: 4096
            numjobs: [ 1 ]
            total_iodepth: [ 4 ]
