tasks:
- exec:
    client.0:
      - |
        set -ex
        
        # Create erasure code profile k=4 m=2
        
        ceph osd erasure-code-profile set reedsol \
          plugin=isa k=4 m=2 technique=reed_sol_van stripe_unit=4K \
          crush-failure-domain=osd
        
        ceph osd pool create rbd_erasure 64 64 erasure reedsol
        ceph osd pool create rbd_replicated 64 64 replicated
        
        ceph osd pool set rbd_erasure allow_ec_overwrites true
        ceph osd pool set rbd_erasure allow_ec_optimizations true
        
        rbd pool init rbd_erasure
        rbd pool init rbd_replicated
        
        for i in $(seq 0 15); do
          rbd create --size 125000 \
            --pool rbd_replicated \
            --data-pool rbd_erasure \
            cbt-librbdfio-${i}
        done

- cbt:
    cluster:
      user: ubuntu
      osds_per_node: 4
      iterations: 1

    benchmarks:
      librbdfio:
        create_report: True
        time: 60
        ramp: 20
        time_based: True
        norandommap: True
        vol_size: 125000
        use_existing_volumes: True
        poolname: 'rbd_replicated'
        rbdname: 'cbt-librbdfio'
        procs_per_volume: [1]
        volumes_per_client: [16]
        osd_ra: [4096]
        log_iops: True
        log_bw: True
        log_lat: True
        fio_out_format: 'json'
        log_avg_msec: 100
        prefill:
          blocksize: '64k'
          numjobs: 1

        workloads:
          precondition:
            jobname: 'precond1rw'
            mode: 'randwrite'
            time: 600
            op_size: 65536
            numjobs: [ 1 ]
            total_iodepth: [ 16 ]
            monitor: False

          4krandomwrite:
            jobname: 'randwrite'
            mode: 'randwrite'
            op_size: 4096
            numjobs: [ 1 ]
            total_iodepth: [ 4, 8, 12, 16, 32, 48, 64, 128, 256, 384 ]

          4krandomread:
            jobname: 'randread'
            mode: 'randread'
            op_size: 4096
            numjobs: [ 1 ]
            total_iodepth: [ 4, 8, 12, 16, 32, 48, 64, 128, 256, 384 ]

          256krandomwrite:
            jobname: 'randwrite'
            mode: 'randwrite'
            op_size: 262144
            numjobs: [ 1 ]
            total_iodepth: [ 1, 2, 4, 8, 16, 32, 64, 96, 128, 256 ]

          256krandomread:
            jobname: 'randread'
            mode: 'randread'
            op_size: 262144
            numjobs: [ 1 ]
            total_iodepth: [ 1, 2, 4, 8, 16, 24, 32, 64, 96, 128 ]

          4Mrandomwrite:
            jobname: 'randwrite'
            mode: 'randwrite'
            op_size: 4194304
            numjobs: [ 1 ]
            total_iodepth: [ 1, 2, 3, 4, 6, 8, 16, 24, 32, 48 ]

          4Mrandomread:
            jobname: 'randread'
            mode: 'randread'
            op_size: 4194304
            numjobs: [ 1 ]
            total_iodepth: [ 1, 2, 4, 8, 12, 16, 20, 24, 28, 32 ]

- cbt_regression:
