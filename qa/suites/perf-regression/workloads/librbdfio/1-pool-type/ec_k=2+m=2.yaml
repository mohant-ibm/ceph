tasks:
- cephadm.shell:
    mon.a:
      - |
        set -ex

        # Create erasure code profile k=2 m=2

        ceph osd erasure-code-profile set reedsol \
          plugin=isa k=2 m=2 technique=reed_sol_van stripe_unit=16K \
          crush-failure-domain=osd

        ceph osd pool create rbd_erasure 64 64 erasure reedsol

        ceph osd pool set rbd_erasure allow_ec_overwrites true
        ceph osd pool set rbd_erasure allow_ec_optimizations true

        rbd pool init rbd_erasure

        ceph osd pool set noautoscale
        ceph balancer off
        ceph osd set nodeep-scrub
        ceph osd set noscrub

        HOST=$(hostname -f)
        for i in $(seq 0 15); do
          rbd create --size 44800 \
            --pool rbd_erasure \
            cbt-librbdfio-${HOST}-${i}
        done

# The cbt task itself is shared, see 2-benchmark/librbdfio.yaml. Only the
# values that depend on the pool layout are set here. vol_size is kept next
# to the 'rbd create --size' above so the two cannot drift apart.
#
# 16 vols x 44800 MiB x 2 (ec 2+2) == 16 vols x 29866 MiB x 3 (replica)
# == 1400 GiB raw, sized for the drives in the trial-perf nodes. Both pool
# types therefore fill the same amount of raw capacity.
overrides:
  cbt:
    benchmarks:
      librbdfio:
        poolname: 'rbd_erasure'
        vol_size: 44800
