# Shared librbdfio benchmark definition.
#
# 'poolname' and 'vol_size' are not set here: they depend on the pool layout
# and are supplied by the 1-pool-type facet via 'overrides: cbt:'.
# 'osds_per_node' comes from the 0-cluster facet for the same reason.
#
# Note that teuthology's deep_merge *extends* lists rather than replacing
# them, so a facet cannot override total_iodepth (or any other list) as
# written. If a pool type or cluster size ever needs different queue depths,
# set the list to [] here and have every facet supply its own values.

tasks:
- cbt:
    cluster:
      user: ubuntu
      iterations: 1

    benchmarks:
      librbdfio:
        time: 60
        ramp: 20
        time_based: True
        norandommap: True
        use_existing_volumes: True
        wait_pgautoscaler_timeout: 30
        rbdname: 'cbt-librbdfio'
        procs_per_volume: [1]
        volumes_per_client: [16]
        osd_ra: [4096]
        log_iops: True
        log_bw: True
        log_lat: True
        fio_out_format: 'json'
        log_avg_msec: 100
        prefill:
          blocksize: '64k'
          numjobs: 1

        workloads:
          0-precondition:
            jobname: 'precond1rw'
            mode: 'randwrite'
            time: 600
            op_size: 65536
            numjobs: [ 1 ]
            total_iodepth: [ 16 ]
            monitor: False

          1-4krandomwrite:
            jobname: 'randwrite'
            mode: 'randwrite'
            op_size: 4096
            numjobs: [ 1 ]
            total_iodepth: [ 4, 8, 12, 16, 32, 48, 64, 128, 256, 384 ]

          2-4krandomread:
            jobname: 'randread'
            mode: 'randread'
            op_size: 4096
            numjobs: [ 1 ]
            total_iodepth: [ 4, 8, 12, 16, 32, 48, 64, 128, 256, 384 ]

          3-256krandomwrite:
            jobname: 'randwrite'
            mode: 'randwrite'
            op_size: 262144
            numjobs: [ 1 ]
            total_iodepth: [ 1, 2, 4, 8, 16, 32, 64, 96, 128, 256 ]

          4-256krandomread:
            jobname: 'randread'
            mode: 'randread'
            op_size: 262144
            numjobs: [ 1 ]
            total_iodepth: [ 1, 2, 4, 8, 16, 24, 32, 64, 96, 128 ]

          5-4Mrandomwrite:
            jobname: 'randwrite'
            mode: 'randwrite'
            op_size: 4194304
            numjobs: [ 1 ]
            total_iodepth: [ 1, 2, 3, 4, 6, 8, 16, 24, 32, 48 ]

          6-4Mrandomread:
            jobname: 'randread'
            mode: 'randread'
            op_size: 4194304
            numjobs: [ 1 ]
            total_iodepth: [ 1, 2, 4, 8, 12, 16, 20, 24, 28, 32 ]
